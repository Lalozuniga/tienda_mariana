<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Birdbrain
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Directorio</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-toolbar>
  <ion-searchbar
    placeholder="Buscar nombre, teléfono, dirección..."
    [debounce]="150"
    (ionInput)="busqueda.set($any($event).detail.value ?? '')"
  />
</ion-toolbar>

  @if (svc.cargando()) {
    <ion-spinner />
  } @else {
    <ion-list>
      @for (c of visibles(); track c.id) {
        <ion-item>
          <ion-label>
            <h2>{{ c.nombre }}</h2>
            <p>{{ c.telefono }}</p>
            <p>{{ c.direccion }}</p>
            <p>{{ c.referencia }}</p>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  }


</ion-content>
